<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#020617" />
    <title>Down for maintenance – Blueprint</title>
    <meta name="description" content="Blueprint is undergoing maintenance. We'll be back soon." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@500&family=Roboto:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg: #020617;
        --brand: #52a9ff;
        --text: #f8fafc;
        --muted: #94a3b8;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Roboto", system-ui, sans-serif;
        font-size: 15px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 24px;
      }

      main {
        max-width: 560px;
        text-align: center;
      }

      h1 {
        font-family: "Funnel Display", sans-serif;
        font-weight: 500;
        font-size: clamp(40px, 6vw, 60px);
        line-height: 1.08;
        letter-spacing: -0.01em;
        margin: 0 0 24px;
      }

      h1 .brand {
        color: var(--brand);
      }

      .back {
        margin: 0 0 8px;
        font-weight: 500;
      }

      .lead {
        margin: 0;
        color: var(--muted);
      }

      .lead a {
        color: var(--brand);
        text-decoration: none;
      }

      .lead a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="back">We'll be back soon</p>
      <p class="lead">
        We're currently performing maintenance on our site. Check our
        <a href="https://status.blueprint.zip">status page</a> and
        <a href="https://bsky.app/profile/blueprint.zip">Bluesky</a> for updates.
      </p>
    </main>
  </body>
</html>
